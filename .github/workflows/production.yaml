name: Vercel Production Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - main
jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Strip Git metadata for Vercel
        run: rm -rf .git
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Notify IndexNow (Bing, Yandex, Seznam, Naver) after a successful production deploy.
  # The IndexNow key is public by design (served at /<key>.txt), so no secret is needed.
  # Pre-migration the live sitemap 404s, so this job no-ops and stays green.
  Ping-IndexNow:
    needs: Deploy-Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for the production sitemap to be live
        id: check
        run: |
          status=000
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://spacedev.io/sitemap-index.xml || echo 000)
            if [ "$status" = "200" ]; then break; fi
            echo "Attempt $i: sitemap HTTP $status — retrying in 15s…"
            sleep 15
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "200" ]; then
            echo "::notice::Production sitemap not live yet (HTTP $status) — skipping IndexNow ping."
          fi
      - name: Ping IndexNow with every sitemap URL
        if: steps.check.outputs.status == '200'
        run: node scripts/indexnow-ping.mjs
